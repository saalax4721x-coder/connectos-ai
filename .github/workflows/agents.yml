name: Agents Verification
on:
  pull_request:
  push:
    branches: [feature/agent-system]
jobs:
  agents:
    if: github.head_ref == 'feature/agent-system' || github.ref == 'refs/heads/feature/agent-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run verify:agents
      - run: npm run typecheck
      - run: npm run build
