name: Context Verification
on:
  pull_request:
    branches: ['feature/context-intelligence']
  push:
    branches: ['feature/context-intelligence']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:context
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
