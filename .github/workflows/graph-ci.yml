name: Graph Engine CI

on:
  push:
    branches:
      - feature/graph-engine
  pull_request:
    branches:
      - feature/opportunity-engine

permissions:
  contents: read

jobs:
  graph-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run verify:graph

  full-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
